name: insurex_app
description: "InsureX – Digital Insurance Claim Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.14
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Image / File handling
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  path: ^1.9.1

  # HTTP / REST API
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  percent_indicator: ^4.2.3
  timeline_tile: ^2.0.0
  dotted_border: ^2.1.0

  # Camera
  camera: ^0.11.1
  cloudinary_api: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
